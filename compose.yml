services:
  # 1. The Database (Postgres)
  db:
    image: postgres:15-alpine
    container_name: kanban_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. The Application (FastAPI)
  web:
    build: .
    container_name: kanban_app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # OVERRIDE the DB_HOST to point to the docker service name 'db'
      - DB_HOST=db
    volumes:
      # Persist uploads so they survive container restarts
      - ./uploads:/code/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
